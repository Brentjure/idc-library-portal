# Cloudflare Pages: the built portal plus functions/ (the /idc-library proxy to the backend).
# With this file present, Pages takes plain variables from [vars] below, not from the dashboard.
name = "idc-library"
pages_build_output_dir = "dist/library-portal/browser"
compatibility_date = "2026-05-01"

[vars]
# The Render backend. Not a secret: it's a public address.
BACKEND_URL = "https://library-qwyt.onrender.com"
