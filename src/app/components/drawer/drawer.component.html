<!-- Backdrop -->
<div
  class="fixed inset-0 z-40 bg-[rgb(20_18_10/0.35)] transition-opacity duration-200"
  [class.opacity-0]="!open()"
  [class.pointer-events-none]="!open()"
  (click)="closed.emit()"
></div>

<aside
  #panel
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  class="fixed inset-y-0 right-0 z-[41] flex w-[min(460px,100%)] flex-col bg-surface shadow-drawer outline-none transition-transform duration-250 ease-out"
  [class.translate-x-[105%]]="!open()"
  [attr.aria-labelledby]="headingId()"
  [attr.aria-hidden]="!open()"
  [attr.inert]="open() ? null : ''"
  (keydown.escape)="closed.emit()"
>
  <header class="flex items-start justify-between gap-3 border-b border-line bg-linear-135 from-gold-soft to-surface to-75% px-5 py-[18px]">
    <div class="flex items-start gap-3.5">
      <span class="grid size-11 flex-none place-items-center rounded-xl bg-gold text-on-gold shadow-[0_8px_18px_-10px_var(--color-gold-deep)]">
        <app-icon [name]="icon()" [size]="22" [stroke]="2" />
      </span>
      <div>
        <h2 class="m-0 font-display text-xl font-bold" [id]="headingId()">{{ heading() }}</h2>
        <p class="hint">{{ hint() }}</p>
        <div class="mt-2.5 flex flex-wrap gap-1.5">
          <ng-content select="[drawerStats]" />
        </div>
      </div>
    </div>
    <button type="button" class="remove-x" aria-label="Close" (click)="closed.emit()">×</button>
  </header>

  <div class="flex flex-1 flex-col gap-[22px] overflow-y-auto px-5 pt-[18px] pb-6">
    <ng-content />
  </div>

  <footer class="flex flex-wrap items-center gap-2.5 border-t border-line bg-surface px-5 pt-3.5 pb-[calc(14px+env(safe-area-inset-bottom,0px))]">
    <ng-content select="[drawerFooter]" />
  </footer>
</aside>
