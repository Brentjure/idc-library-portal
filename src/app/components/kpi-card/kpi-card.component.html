<div class="flex items-center gap-2.5 text-[12.5px] font-medium text-ink-2">
  <span class="grid size-[30px] flex-none place-items-center rounded-full" [class]="alert() ? 'bg-bad-bg text-bad' : 'bg-gold-soft text-gold-deep'">
    <app-icon [name]="icon()" [size]="15" />
  </span>
  {{ label() }}
</div>
<div>
  <div
    class="num origin-left font-display text-2xl leading-none font-bold"
    aria-hidden="true"
    [class.text-bad]="alert() && !!value()"
    [class.animate-bump]="bumping()"
    (animationend)="bumpDone()"
  >
    {{ shown() ?? '–' }}
  </div>
  <!-- Screen readers get the final number, not every step of the count. -->
  <span class="sr-only">{{ value() ?? 'Loading' }}</span>
  <div class="mt-1 text-[11.5px] text-ink-3">{{ caption() }}</div>
</div>
