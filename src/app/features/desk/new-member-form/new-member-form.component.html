<form class="flex flex-col gap-3 rounded-[14px] border border-line bg-surface-2 p-3.5" (submit)="$event.preventDefault(); save()">
  <b class="text-[13px]">New member</b>

  <div>
    <label class="field-label" [for]="idPrefix() + '-new-name'">Full name</label>
    <input class="field-input" [id]="idPrefix() + '-new-name'" [value]="name()" (input)="name.set(text($event))" />
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
    <div>
      <label class="field-label" [for]="idPrefix() + '-new-phone'">Phone <span class="opt">optional</span></label>
      <input
        class="field-input"
        inputmode="tel"
        placeholder="0712 448 210"
        [id]="idPrefix() + '-new-phone'"
        [value]="phone()"
        (input)="phone.set(text($event))"
      />
    </div>
    <div>
      <label class="field-label" [for]="idPrefix() + '-new-group'">Group <span class="opt">optional</span></label>
      <input
        class="field-input"
        placeholder="e.g. Choir"
        [id]="idPrefix() + '-new-group'"
        [value]="group()"
        (input)="group.set(text($event))"
      />
    </div>
  </div>

  @if (error()) {
    <p class="err-msg">{{ error() }}</p>
  }

  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-sm" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm" [disabled]="name().trim().length < 2 || saving()">
      {{ saving() ? 'Adding…' : 'Add member' }}
    </button>
  </div>
</form>
