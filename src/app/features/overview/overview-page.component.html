<section class="grid grid-cols-2 gap-3 min-[481px]:gap-3.5 min-[1281px]:grid-cols-4" aria-label="Library at a glance">
  <app-kpi-card label="Total Books" icon="book" [value]="summary()?.copiesInStock" [caption]="titlesCaption()" [highlight]="true" />
  <app-kpi-card label="Active Members" icon="users" caption="Members on record" [value]="summary()?.activeMembers" />
  <app-kpi-card label="Borrowed Now" icon="bookOpen" caption="Books out" [value]="summary()?.borrowedNow" />
  <app-kpi-card label="Overdue Returns" icon="clock" caption="Past their due date" [value]="summary()?.overdue" [alert]="true" />
</section>

<div class="grid items-start gap-[18px] min-[1151px]:grid-cols-[minmax(0,1fr)_minmax(0,320px)]">
  <app-borrowed-today [checkedInToday]="summary()?.returnedToday ?? 0" />
  <app-needs-attention [overdue]="summary()?.overdue ?? 0" [unlabelled]="summary()?.unlabelledCopies ?? 0" />
</div>
